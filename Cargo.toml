[package]
name = "qdrant"
version = "0.1.0"
edition = "2024"

[lib]
name = "plugin"
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "=1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64-serde = "0.8"
base64 = "0.22"

anyhow = "1.0"
uuid = { version = "1.19", features = ["v4"] }
